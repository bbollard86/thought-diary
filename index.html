    --paper:#141B1F; --surface:#1C252A; --ink:#E4ECEA; --muted:#9AABAE; --line:#2E3A40;

  }
}

  --paper:#141B1F; --surface:#1C252A; --ink:#E4ECEA; --muted:#9AABAE; --line:#2E3A40;
  --accent:#6FB8AF; --accent-ink:#0F1A1A; --accent-soft:#22403C; --warm:#D9A55E; --warm-soft:#3A2F20; --danger:#E07B7B;

}

<script>
/* ---------- Course content (summaries written for this app) ---------- */
const CCI_HOME="https://www.cci.health.wa.gov.au/Resources/Looking-After-Yourself/Health-Anxiety";
const MODULES=[
{n:1,t:"Understanding health anxiety",s:"What it is and when it becomes a problem",
 url:"https://cci.health.wa.gov.au/~/media/CCI/Consumer%20Modules/Helping%20Health%20Anxiety/Helping%20Health%20Anxiety%20-%2001%20-%20Understanding%20Health%20Anxiety.pdf",
 ideas:[
 "Everyone worries about their health sometimes. Noticing changes in your body and wondering what they mean is part of being human.",
 "Health is broader than not being sick. It covers how you’re going physically, mentally and socially, and it sits on a sliding scale rather than being all or nothing.",
 "Anxiety is your body’s alarm system. It goes off when you sense danger, whether the danger is real or only possible. Health anxiety is that alarm firing over a possible threat to your health, or sometimes a loved one’s.",
 "It becomes a problem when the worry is out of proportion to the real risk, sticks around despite clear tests or a doctor’s reassurance, drives a lot of checking, reassurance seeking or avoidance, and gets in the way of everyday life.",
 "Your symptoms can be completely real. What matters is how you respond to them, not whether they exist.",
 "Health anxiety can strain relationships with family, friends and doctors, make work or study harder, cost money, take the fun out of life, and add a layer of anxiety symptoms on top of everything else.",
 "The modules build on each other, so working through them in order gives the most benefit. You can still jump to any module whenever you need it."],
 tools:["m1start","m1check","m1impact"]},
{n:2,t:"How health anxiety develops",s:"The experiences and beliefs that set it up",
 url:"https://cci.health.wa.gov.au/-/media/CCI/Consumer-Modules/Helping-Health-Anxiety/Helping-Health-Anxiety---02---How-Health-Anxiety-Develops.pdf",
 ideas:[
 "There’s no single cause. Some people may be biologically more prone to anxiety, and life experiences add to that.",
 "Experiences that commonly feed health worries include watching someone close go through a serious illness, losing someone (especially suddenly or after a long illness), having a medical problem yourself, growing up around someone who worried a lot about health, and frightening health stories in the media or online.",
 "These experiences can leave you with a sense that your health is fragile and that illness is common, painful or hopeless.",
 "To protect yourself, you might develop rigid rules (“I must…”, “My doctor should…”, “If… then…”) and become highly tuned in to every sensation in your body.",
 "Rules aren’t the problem in themselves. They become unhelpful when they’re inaccurate or too rigid to bend to real life.",
 "Bodies are noisy, a bit like an old car that rattles but keeps running. Watching a sensation closely tends to make it feel stronger and more worrying.",
 "This vulnerability can sit quietly for years until something triggers it. The good news is that you don’t need to change your past to recover. What keeps it going now is what you can change."],
 tools:["m2dev"]},
{n:3,t:"What keeps health anxiety going",s:"Triggers and the vicious cycle",
 url:"https://www.cci.health.wa.gov.au/~/media/CCI/Consumer%20Modules/Helping%20Health%20Anxiety/Helping%20Health%20Anxiety%20-%2003%20-%20What%20Keeps%20Health%20Anxiety%20Going.pdf",
 ideas:[
 "Triggers can be internal, like normal body sensations or a new symptom, or external, like a news story, an upcoming appointment, someone else’s diagnosis, an unclear test result or being away from your usual doctors.",
 "A trigger switches on your health rules, and you start reading sensations or medical information in the most catastrophic way possible.",
 "Catastrophic thoughts set off the fight-or-flight response. Its physical effects, such as a racing heart, tension, dizziness, tingling and an upset stomach, then become new things to worry about.",
 "Four patterns keep the cycle turning: focusing on symptoms, checking and reassurance seeking, avoidance, and safety behaviours (only doing things with precautions in place).",
 "Each one brings short-term relief. In the long run, focusing amplifies symptoms, checking can cause soreness, no amount of reassurance gives total certainty, and avoidance stops you learning that your fears may not come true.",
 "Mapping your own cycle shows exactly where you can break it. Rules and assumptions are left until Module 8 because they’re the hardest to shift, and they loosen more easily once the cycle is weakened."],
 tools:["m3cycle"]},
{n:4,t:"Reducing your focus on symptoms",s:"Attention training and worry postponement",
 url:"https://cci.health.wa.gov.au/~/media/CCI/Consumer%20Modules/Helping%20Health%20Anxiety/Helping%20Health%20Anxiety%20-%2004%20-%20Reducing%20Your%20Focus%20on%20Health%20Symptoms%20and%20Worries.pdf",
 ideas:[
 "Scanning your body and dwelling on worries feeds the cycle and pulls your attention away from everything else. The goal is to retrain where your attention goes.",
 "First, check whether you believe worrying or watching your body is useful, for example that it keeps you safe or prepared. If so, put that belief to the test before trying to let it go.",
 "Think of attention as a muscle that gets stronger with practice. A wandering mind is normal. The skill is noticing it has wandered and bringing it back, so every wander is another repetition.",
 "Everyday task focus: during routine jobs like dishes, showering or gardening, keep returning your attention to what you can feel, see, hear, smell and taste.",
 "Mindfulness: notice what’s present, rest your attention on your breath, then widen it to your whole body breathing. Build up towards ten minutes twice a day.",
 "Worry postponement: set a daily worry period (same time and place, up to 30 minutes, not right before bed). When a worry pops up, jot it down in a few words and save it for later. By then, many worries have lost their grip.",
 "When to get checked: use the self-care you already know for colds, headaches and backaches. For many symptoms, such as pain or a cold, wait about two weeks, and see your doctor if it’s still there. Get prompt care for a high fever, severe pain or signs of a worsening infection. If you have a diagnosis or take medication, work out your own guidelines with your doctor."],
 tools:["m4belief","worry","meditate","attention","worryreview"]},
{n:5,t:"Re-evaluating unhelpful thinking",s:"Thought diaries and weighing up evidence",
 url:"https://www.cci.health.wa.gov.au/~/media/CCI/Consumer-Modules/Helping-Health-Anxiety/Helping-Health-Anxiety---05---Re-Evaluating-Unhelpful-Health-Related-Thinking.pdf",
 ideas:[
 "How you interpret a situation, more than the situation itself, shapes how you feel and what your body does.",
 "Health anxiety tends to overestimate how likely a serious illness is and how bad it would be, dismiss less frightening explanations, and underestimate your ability to cope.",
 "Thoughts are guesses, not facts. Approach them like a detective: weigh the evidence for and against, consider other explanations and settle on the most likely one.",
 "Do this on paper (or in the thought diary), not in your head, where it gets tangled. If worries come often, postpone them and use the diary during your worry period.",
 "Be a careful consumer of health information. Search neutrally (“common causes of headaches” rather than “headache brain tumour”), look for both sides, and favour reputable, current sources.",
 "Keep a summary of your realistic thoughts so you can revisit them when an old worry returns. If a realistic thought stops feeling believable, do a fresh diary entry."],
 tools:["diary","summary"]},
{n:6,t:"Reducing checking and reassurance seeking",s:"Breaking the reassurance cycle",
 url:"https://cci.health.wa.gov.au/-/media/CCI/Consumer-Modules/Helping-Health-Anxiety/Helping-Health-Anxiety---06---Reducing-Checking-and-Reassurance-Seeking.pdf",
 ideas:[
 "Checking and seeking reassurance bring brief relief, but no test can rule out everything, so doubt returns and the cycle starts again.",
 "Living with some uncertainty about health is something everyone has to do. Constant checking stops you building that tolerance.",
 "The aim isn’t zero checking. Never checking and constantly checking are both unhelpful; the goal is a healthy middle.",
 "Too much checking can cause soreness, cost money and time, and strain relationships with family, friends and doctors.",
 "Start by noticing how often you check, then pick one or two behaviours to work on.",
 "Three steps: evaluate the behaviour and decide whether to decrease, postpone or eliminate it; set a new goal (gradually, with a stepladder, if needed) and plan how you’ll cope; then test it out and see what you learn.",
 "Decrease or postpone a behaviour that’s medically sensible but overdone. Eliminate one that goes against medical advice, like symptom forums or painful self-examination. Your GP can tell you what’s appropriate for you.",
 "The urge to check rises and then passes. Ride it out, use your attention skills, and reward yourself for hard steps."],
 tools:["m6inventory","m6reduce","ladder"]},
{n:7,t:"Challenging avoidance and safety behaviours",s:"Graded exposure, step by step",
 url:"https://www.cci.health.wa.gov.au/~/media/CCI/Consumer%20Modules/Helping%20Health%20Anxiety/Helping%20Health%20Anxiety%20-%2007%20-%20Challenging%20Avoidance%20and%20Safety%20Behaviours.pdf",
 ideas:[
 "Avoidance means staying away from people, places, activities or thoughts linked to illness, or from things that change how your body feels, like exercise or coffee.",
 "Safety behaviours are a subtler form: doing the thing only with a backup in place, like carrying medication or a phone “just in case”.",
 "Both ease anxiety in the moment, but your fears never get tested, your confidence shrinks and life can become very narrow.",
 "Trying not to think about illness or death tends to backfire, the same way trying not to picture a pink elephant does.",
 "Graded exposure means facing fears gradually. List what you avoid, choose specific goals that matter to you, and build a stepladder of steps rated 0–100 for distress. Change who, what, when, where or how long to create easier steps.",
 "Exposure can include feared thoughts too, such as writing a will, reading about a condition you fear, or writing a worry story in the first person and rereading it until it loses its sting.",
 "For each step: plan when, expect some anxiety, remind yourself of your realistic thoughts, stay until the anxiety eases, and drop safety behaviours.",
 "Repeat each step several times before moving up, acknowledge your wins, and if a step goes badly, add an in-between step or go back one."],
 tools:["m7avoid","ladder","exposure","story"]},
{n:8,t:"Adjusting health rules and assumptions",s:"Making your rules realistic and flexible",
 url:CCI_HOME,
 ideas:[
 "We all live by rules we picked up from early experiences and the people around us, often without realising.",
 "Helpful rules are realistic and flexible. Unhelpful ones are rigid or unreasonable, like expecting a doctor to explain every sensation you have.",
 "Unhelpful health rules often sound like “I must always…”, “My doctor should…”, “I should never…” or “If… then [something terrible]”.",
 "To adjust a rule, ask where it came from and why it’s still here, what impact it has on your life, and in what ways it’s unrealistic or unhelpful.",
 "Then write a balanced alternative. Softer words help (“I’d prefer…”, “sometimes…”), as does giving “if… then” statements a less alarming ending. Balanced rules are often longer, because they allow for real life.",
 "Plan daily actions that put the new rule into practice. Old rules take time to wear out, so keep the new one somewhere handy.",
 "Keep the genuinely helpful rules, like seeing a doctor if pain is getting worse."],
 tools:["m8identify","m8adjust"]},
{n:9,t:"Healthy living and self-management",s:"Your new way of operating and staying on track",
 url:"https://cci.health.wa.gov.au/~/media/CCI/Consumer%20Modules/Helping%20Health%20Anxiety/Helping%20Health%20Anxiety%20-%2009%20-%20Healthy%20Living%20and%20Self-Management%20Planning.pdf",
 ideas:[
 "Triggers will still switch on old rules from time to time. What changes is how you respond.",
 "When that happens: adjust the rule, let go of your focus on symptoms (attention exercises and postponement), re-evaluate worrying thoughts with a thought diary, reduce checking and reassurance seeking, and gradually face what you avoid.",
 "Doing things differently usually feels harder at first. Over time you worry less, bring on fewer symptoms, spend less time checking or avoiding, and have more time for what matters.",
 "Setbacks are a normal part of change, much like learning a new sport. Focus on getting back on track rather than on the slip itself.",
 "A self-management plan helps you spot early warning signs and risky situations, and reminds you which strategies and coping statements work for you.",
 "Looking after your overall health gives you less to worry about. Set specific, practical actions for social connection, stress, diet, exercise, fun, sleep and personal goals."],
 tools:["m9plan","m9healthy"]}
];

function isFilled(v){if(v==null)return false;if(typeof v==='string')return v.trim()!=='';if(typeof v==='number')return true;if(Array.isArray(v))return v.length>0;if(typeof v==='object')return Object.keys(v).length>0;return false}

/* ---------- Generic worksheet ---------- */
let R=null; // record being edited
function fieldHTML(f){
  const v=R[f.k];
  if(f.type==='head')return '<h3 class="sec">'+esc(f.l)+'</h3>';
  let h='<div class="field">';
  const lbl=(f.type==='text'||f.type==='area'||f.type==='rate')?'<label for="w-'+f.k+'">'+esc(f.l)+'</label>':'<span class="lbl">'+esc(f.l)+'</span>';
  h+=lbl+(f.h?'<p class="hint">'+esc(f.h)+'</p>':'');
  if(f.type==='text')h+='<input type="text" id="w-'+f.k+'" data-k="'+f.k+'" value="'+esc(v)+'">';
  else if(f.type==='area')h+='<textarea id="w-'+f.k+'" data-k="'+f.k+'" rows="'+(f.rows||3)+'">'+esc(v)+'</textarea>';
  else if(f.type==='rate')h+='<div class="rate"><input type="range" min="0" max="100" step="5" id="w-'+f.k+'" data-rk="'+f.k+'" value="'+(v==null?50:v)+'"><output>'+(v==null?'-':v+'%')+'</output></div>';
  else if(f.type==='choice')h+='<div class="seg3">'+f.o.map(o=>'<button data-ck="'+f.k+'" data-cv="'+esc(o)+'" aria-pressed="'+(v===o)+'">'+esc(o)+'</button>').join('')+'</div>';
  else if(f.type==='check'){const sel=v||[];h+='<div class="chips">'+f.o.map(o=>'<button class="chip" data-xk="'+f.k+'" data-xv="'+esc(o)+'" aria-pressed="'+(sel.indexOf(o)>=0)+'">'+esc(o)+'</button>').join('')+'</div>'}
  else if(f.type==='scale4'){const a=v||{};h+=f.items.map((it,i)=>'<div class="sq"><p>'+esc(it)+'</p><div class="seg4">'+OPT4.map((o,j)=>'<button data-sk="'+f.k+'" data-si="'+i+'" data-sv="'+j+'" aria-pressed="'+(a[i]===j)+'">'+o+'</button>').join('')+'</div></div>').join('')+'<div class="result" id="res-'+f.k+'">'+scaleResult(f,a)+'</div>'}
  else if(f.type==='steps'){h+='<div id="steps-'+f.k+'">'+stepsHTML(f.k)+'</div>'}
  else if(f.type==='log'){const L=v||[];h+='<div class="rate"><input type="range" min="0" max="100" step="5" id="log-'+f.k+'" value="50"><output>50%</output></div><button class="btn ghost" data-logk="'+f.k+'">Log this reading</button>'+(L.length?'<ul class="loglist">'+L.slice().reverse().map(x=>'<li><span>'+esc(fmtShort(x.ts))+'</span><b>'+x.v+'%</b></li>').join('')+'</ul>':'')}
  return h+'</div>';
}
function scaleResult(f,a){const n=Object.keys(a).length;if(!n)return '';const hi=Object.values(a).filter(x=>x>=2).length;return '<b>'+hi+' of '+f.items.length+'</b> answered Often or Very often'+(n<f.items.length?' ('+n+' answered so far)':'')+'.<br>If that’s most of them, health anxiety is probably worth working on. Even a few can mean these skills will help.'}
function stepsHTML(k){
  const L=R[k]||[];
  let h=L.length?'':'<p class="hint">No steps yet.</p>';
  h+=L.map((s,i)=>'<div class="stp'+(s.done?' ok':'')+'"><div class="row"><input type="checkbox" data-sd="'+i+'" '+(s.done?'checked':'')+' aria-label="Step done"><input type="text" data-st="'+i+'" value="'+esc(s.t)+'" placeholder="Describe the step"><button class="x" data-sx="'+i+'" aria-label="Remove step">×</button></div><div class="rate"><span class="mini">Distress</span><input type="range" min="0" max="100" step="5" data-sr="'+i+'" value="'+(s.d==null?50:s.d)+'"><output>'+(s.d==null?'-':s.d)+'</output></div></div>').join('');
  h+='<div class="row"><button class="btn quiet" data-sadd="'+k+'">+ Add a step</button>'+(L.length>1?'<button class="btn quiet" data-ssort="'+k+'">Sort by distress</button>':'')+'</div>';

}

/* ---------- Mindfulness timer ---------- */
const PHASES=[
 {t:'Settle and notice',x:'Sit comfortably, upright but relaxed. Ask yourself what you’re experiencing right now: what thoughts, feelings and body sensations are here? Just observe and describe them, without judging or trying to change anything.'},
 {t:'Follow the breath',x:'Bring your attention to your belly rising and falling with each breath. You might say “let go” as you breathe out. When your mind wanders, notice where it went, let it be, and gently return to the breath.'},
 {t:'Whole body breathing',x:'Widen your attention to your whole body breathing. If strong feelings are around, let them be there: whatever it is, it’s OK. When thoughts or sensations pull you away, acknowledge them and come back to the whole body breathing.'}];
const LENGTHS={'5 minutes':[60,120,120],'10 minutes':[60,270,270]};
let M={len:'5 minutes',run:false,start:0,paused:0,elapsed:0,lock:null,doneAt:0};
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null}if(M.lock){try{M.lock.release()}catch(e){}M.lock=null}M.run=false}
function medState(){const L=LENGTHS[M.len],tot=L.reduce((a,b)=>a+b,0),el=Math.min(M.elapsed,tot);let acc=0,p=0;for(;p<L.length;p++){if(el<acc+L[p])break;acc+=L[p]}return{tot,el,p:Math.min(p,2),left:tot-el,done:el>=tot}}
function mmss(s){s=Math.ceil(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function meditateView(){
  const st=medState();
  let h=hdr('Mindfulness timer','m4');
  h+='<div class="seg3" style="margin-bottom:18px">'+Object.keys(LENGTHS).map(k=>'<button data-ml="'+k+'" aria-pressed="'+(M.len===k)+'" '+((M.run||M.elapsed)?'disabled':'')+'>'+k+'</button>').join('')+'</div>';
  h+='<div class="timer"><div class="ring" style="--p:'+(st.el/st.tot*360)+'deg"><div><span id="mt">'+mmss(st.left)+'</span><small id="mp">'+(st.done?'Finished':((M.run||M.elapsed)?'Step '+(st.p+1)+' of 3':'Ready'))+'</small></div></div></div>';
  h+='<div class="card" id="mph"><h3>'+(st.done?'Well done':esc(PHASES[st.p].t))+'</h3><p>'+(st.done?'Every time you noticed your mind wandering and brought it back, you strengthened your attention.':esc(PHASES[st.p].x))+'</p></div>';
  h+='<div class="row">'+(st.done?'<button class="btn" id="mlog">Add to attention log</button><button class="btn ghost" id="mreset">Start again</button>':'<button class="btn" id="mgo">'+(M.run?'Pause':(M.elapsed?'Resume':'Start'))+'</button>'+((M.run||M.elapsed)?'<button class="btn quiet" id="mreset">Reset</button>':''))+'</div>';
  h+='<p class="hint" style="margin-top:16px">Aim to build up to ten minutes twice a day. Keep the screen on while you practise.</p>';
  return h;
}
function bindMeditate(){
  document.querySelectorAll('[data-ml]').forEach(b=>b.addEventListener('click',()=>{M.len=b.dataset.ml;rerender(true)}));
  const g=document.getElementById('mgo');
  g&&g.addEventListener('click',async()=>{
    if(M.run){M.elapsed=(Date.now()-M.start)/1000;stopTimer();rerender(true);return}
    M.run=true;M.start=Date.now()-M.elapsed*1000;
    try{if(navigator.wakeLock)M.lock=await navigator.wakeLock.request('screen')}catch(e){}
    let lastP=medState().p;
    S.timer=setInterval(()=>{M.elapsed=(Date.now()-M.start)/1000;const st=medState();
      if(st.done||st.p!==lastP){lastP=st.p;if(st.done){stopTimer();M.elapsed=st.tot}rerender(true);return}
      const t=document.getElementById('mt');if(t)t.textContent=mmss(st.left);
      const r=document.querySelector('.ring');if(r)r.style.setProperty('--p',(st.el/st.tot*360)+'deg');},250);
    rerender(true);
  });
  const r=document.getElementById('mreset');r&&r.addEventListener('click',()=>{stopTimer();M.elapsed=0;rerender(true)});
  const l=document.getElementById('mlog');l&&l.addEventListener('click',()=>{if(!Array.isArray(D.forms.attention))D.forms.attention=[];const rec={id:uid(),created:Date.now(),type:'Meditation',task:'Mindfulness practice',dur:M.len};D.forms.attention.push(rec);saveD();stopTimer();M.elapsed=0;go('f-attention-'+rec.id)});
}

/* ---------- Thought diary ---------- */
let F=null;let draftTimer=null;
function blank(){return{id:null,created:null,trigger:'',thoughts:'',hot:'',beliefBefore:50,emotions:[{name:'Worried',before:50,after:null}],sensations:'',evFor:'',evAgainst:'',worstEffect:'',worstCope:'',alternatives:'',likely:'',copeNow:'',realistic:'',beliefAfter:null,sensationChange:''}}


async function saveEntry(e){
  const i=S.entries.findIndex(x=>x.id===e.id);
  if(i>=0)S.entries[i]=e;else S.entries.push(e);
  lsSet(LS_ENTRIES,S.entries);return true;
}
async function deleteEntry(id){
  S.entries=S.entries.filter(x=>x.id!==id);lsSet(LS_ENTRIES,S.entries);return true;
}

function sorted(){return S.entries.slice().sort((a,b)=>(b.created||0)-(a.created||0))}
function shiftHTML(e){
  if(e.beliefAfter==null)return '<div class="shift-lbl"><span>Belief <b class="kb">'+e.beliefBefore+'%</b></span><span>Not re-rated yet</span></div>';
  const b=e.beliefBefore,a=e.beliefAfter,lo=Math.min(a,b),w=Math.abs(b-a);
  return '<div class="shift" aria-label="Belief '+b+' percent before, '+a+' percent after">'+
    '<div class="track"><span class="seg" style="left:'+lo+'%;width:'+w+'%"></span><span class="dot b" style="left:'+b+'%"></span><span class="dot a" style="left:'+a+'%"></span></div>'+
    '<div class="shift-lbl"><span>Belief before <b class="kb">'+b+'%</b></span><span>After <b class="ka">'+a+'%</b></span></div></div>';
}
function hotOf(e){return e.hot||(e.thoughts||'').split('\n').find(s=>s.trim())||'Untitled entry'}


function diaryHomeView(){
  const list=sorted(),d=lsGet(LS_DRAFT);
  let h='<header class="top"><button class="icon" data-back="m5" aria-label="Back">‹</button><h2>Thought diary</h2><button class="btn" id="newBtn">New entry</button></header>';
  if(d&&(d.trigger||d.thoughts||d.hot))h+='<div class="draft"><p>You have an unfinished entry.</p><button class="btn ghost" id="resume">Continue</button></div>';
  if(!list.length){
    h+='<div class="empty"><h2>Catch a worry, then question it</h2><p>When a health worry shows up, jot it down, look at the evidence, and work towards a more realistic thought. If you’re postponing worries, save this for your worry period.</p></div>';
  }else{
    h+=list.map(e=>'<button class="entry" data-id="'+esc(e.id)+'"><time>'+esc(fmtDate(e.created))+'</time><p class="hot">'+esc(hotOf(e))+'</p>'+(e.realistic?'<p class="real">'+esc(e.realistic)+'</p>':'')+shiftHTML(e)+'</button>').join('');
    h+='<div class="footer-links"><button class="btn ghost" onclick="location.hash=\'summary\'">Summary of my thoughts</button></div>';
  }
  return h;
}
function bindDiaryHome(){
  const n=document.getElementById('newBtn');n&&n.addEventListener('click',()=>{lsDel(LS_DRAFT);go('new')});
  const r=document.getElementById('resume');r&&r.addEventListener('click',()=>{const d=lsGet(LS_DRAFT);go(d&&d.id?'edit-'+d.id:'new')});
  document.querySelectorAll('.entry').forEach(b=>b.addEventListener('click',()=>go('entry-'+b.dataset.id)));
}

function summaryView(){
  const list=sorted().filter(e=>e.realistic);
  let h='<header class="top"><button class="icon" data-back="diary" aria-label="Back">‹</button><h2>Summary of my thoughts</h2></header>';
  h+='<p class="lead">A quick reference for when an old worry comes back. If a realistic thought doesn’t feel believable when you read it, do a fresh entry on that worry.</p>';
  if(!list.length)return h+'<div class="empty"><p>Finished entries with a realistic thought will appear here.</p></div>';
  return h+list.map(e=>'<div class="pair"><p class="o">'+esc(hotOf(e))+'</p><p class="n">'+esc(e.realistic)+'</p></div>').join('');
}

function detailView(e){
  const item=(k,v)=>v?'<div class="d-item"><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>':'';
  const emo=(e.emotions||[]).filter(x=>x.name).map(x=>x.name+' '+x.before+'%'+(x.after!=null?' to '+x.after+'%':'')).join('\n');
  let h='<header class="top"><button class="icon" data-back="diary" aria-label="Back">‹</button><h2>'+esc(fmtDate(e.created))+'</h2></header>';
  h+='<div class="pair"><p class="o">'+esc(hotOf(e))+'</p>'+(e.realistic?'<p class="n">'+esc(e.realistic)+'</p>':'')+'<div style="margin-top:12px">'+shiftHTML(e)+'</div></div>';
  h+='<div class="d-sec"><h3>Notice</h3>'+item('What triggered it',e.trigger)+item('Worries and predictions',e.thoughts)+item('Emotions',emo)+item('Physical sensations',e.sensations)+'</div>';
  h+='<div class="d-sec"><h3>Question</h3>'+item('Evidence for',e.evFor)+item('Evidence against',e.evAgainst)+item('How expecting the worst affects me',e.worstEffect)+item('How I’d cope if the worst happened',e.worstCope)+item('Other explanations',e.alternatives)+item('Most likely explanation',e.likely)+item('What I can do right now',e.copeNow)+'</div>';
  h+='<div class="d-sec"><h3>Rethink</h3>'+item('More realistic thought',e.realistic)+item('Physical sensations now',e.sensationChange)+'</div>';
  h+='<div class="row"><button class="btn" id="edit">Edit</button><button class="btn danger" id="del">Delete</button></div>';
  return h;
}
function bindDetail(e){
  if(!e)return;
  document.getElementById('edit').addEventListener('click',()=>go('edit-'+e.id));
  document.getElementById('del').addEventListener('click',async()=>{if(!confirm('Delete this entry? This can’t be undone.'))return;if(await deleteEntry(e.id)){toast('Entry deleted');go('diary')}});
}


function openForm(e){
  if(F)return;
  const d=lsGet(LS_DRAFT);
  if(e){F=(d&&d.id===e.id)?d:JSON.parse(JSON.stringify(e))}
  else{F=(d&&!d.id)?d:blank()}
  if(!F.emotions||!F.emotions.length)F.emotions=[{name:'',before:50,after:null}];
}
function saveDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(()=>lsSet(LS_DRAFT,F),400)}
const STEPS=['Notice','Question','Rethink'];
function ta(key,label,hint,rows){return '<div class="field"><label for="f-'+key+'">'+label+'</label>'+(hint?'<p class="hint">'+hint+'</p>':'')+'<textarea id="f-'+key+'" data-f="'+key+'" rows="'+(rows||3)+'">'+esc(F[key])+'</textarea></div>'}
function rate(key,label,val,was){const v=val==null?(was!=null?was:50):val;return '<div class="field"><label for="f-'+key+'">'+label+'</label><div class="rate"><input type="range" min="0" max="100" step="5" id="f-'+key+'" data-r="'+key+'" value="'+v+'"><output id="o-'+key+'">'+(val==null&&was!=null?'-':v+'%')+'</output></div>'+(was!=null?'<p class="was">Before: '+was+'%</p>':'')+'</div>'}

function chipsHTML(lines){return lines.length>1?'<p class="hint">Tap one, or write it below.</p><div class="chips">'+lines.map(l=>'<button class="chip" data-hot="'+esc(l)+'" aria-pressed="'+(F.hot===l)+'">'+esc(l)+'</button>').join('')+'</div>':''}
function bindChips(){document.querySelectorAll('[data-hot]').forEach(c=>c.addEventListener('click',()=>{F.hot=c.dataset.hot;document.getElementById('f-hot').value=F.hot;document.querySelectorAll('[data-hot]').forEach(x=>x.setAttribute('aria-pressed',String(x===c)));saveDraft()}))}
function formView(){
  const s=S.step,title=F.id?'Edit entry':'New entry';
  let h='<header class="top"><button class="icon" id="back" aria-label="Back">‹</button><h2>'+title+'</h2></header>';
  h+='<nav class="steps" aria-label="Steps">'+STEPS.map((n,i)=>'<button data-step="'+i+'" '+(i===s?'aria-current="step"':'')+' class="'+(i<s?'done':'')+'">'+(i+1)+'. '+n+'</button>').join('')+'</nav>';
  if(s===0){
    h+=ta('trigger','What triggered this?','A sensation, a symptom, something you read, waiting on a result…',2);
    h+=ta('thoughts','What am I worried about?','What am I predicting? What conclusions am I jumping to? One thought per line.',4);
    const lines=(F.thoughts||'').split('\n').map(x=>x.trim()).filter(Boolean);
    h+='<div class="field"><span class="lbl">Which thought bothers me most?</span><div id="chipbox">'+chipsHTML(lines)+'</div>';
    h+='<input type="text" data-f="hot" id="f-hot" aria-label="Most bothersome thought" value="'+esc(F.hot)+'" placeholder="'+(lines[0]?esc(lines[0]):'The thought that worries me most')+'"></div>';
    h+=rate('beliefBefore','How much do I believe it?',F.beliefBefore);
    h+='<div class="field"><span class="lbl">What am I feeling?</span><p class="hint">Name each emotion and rate how strong it is.</p><div id="emos">'+F.emotions.map((x,i)=>'<div class="emo"><div class="row"><input type="text" data-emo="'+i+'" value="'+esc(x.name)+'" placeholder="Emotion" aria-label="Emotion"><button class="x" data-rmemo="'+i+'" aria-label="Remove emotion">×</button></div><div class="rate"><input type="range" min="0" max="100" step="5" data-emob="'+i+'" value="'+x.before+'" aria-label="Intensity"><output>'+x.before+'%</output></div></div>').join('')+'</div><button class="btn quiet" id="addEmo">+ Add an emotion</button></div>';
    h+=ta('sensations','What do I notice in my body?','For example, heart racing, tight chest, tense muscles, tiredness.',2);
  }else if(s===1){
    h+=ta('evFor','What’s the factual evidence for this thought?','',3);
    h+=ta('evAgainst','What’s the factual evidence against it?','',3);
    h+='<details class="help"><summary>Is this good evidence?</summary><ul><li>Written by a qualified, registered health professional</li><li>From a reputable organisation like a government health body, university or major hospital</li><li>Not selling a product or a sensational story</li><li>Backed by several research studies, not one anecdote</li><li>Based on lots of people similar to me</li><li>Consistent with other reputable sources and recently reviewed</li></ul><p class="hint" style="margin:6px 0 0">Online information can’t diagnose you. Your GP can explain what it means for you.</p></details>';
    h+=ta('worstEffect','How does it affect me when I expect the worst?','',2);
    h+=ta('worstCope','If the worst did happen, how could I cope?','Think about treatment, support from people around you, and how you’ve handled hard things before.',3);
    h+=ta('alternatives','What else could explain my symptoms, or my doctor’s response?','Changes in routine, sleep, diet, medication or activity? More stress lately? A minor illness like a cold?',3);
    h+=ta('likely','What’s the most likely explanation?','',2);
    h+=ta('copeNow','What can I do to cope with this right now?','',3);
  }else{
    h+=ta('realistic','What’s a more realistic thought?','Draw on your answers in the last step.',3);
    h+=rate('beliefAfter','How much do I believe the original thought now?',F.beliefAfter,F.beliefBefore);
    const named=F.emotions.map((x,i)=>[x,i]).filter(p=>p[0].name.trim());
    if(named.length)h+='<div class="field"><span class="lbl">How strong are my emotions now?</span>'+named.map(([x,i])=>{const v=x.after==null?x.before:x.after;return '<div class="emo"><div style="font-weight:700">'+esc(x.name)+'</div><div class="rate"><input type="range" min="0" max="100" step="5" data-emoa="'+i+'" value="'+v+'" aria-label="'+esc(x.name)+' now"><output>'+(x.after==null?'-':x.after+'%')+'</output></div><p class="was">Before: '+x.before+'%</p></div>'}).join('')+'</div>';
    h+='<div class="field"><span class="lbl">My physical sensations are now</span><div class="seg3">'+['More intense','The same','Less intense'].map(o=>'<button data-sens="'+o+'" aria-pressed="'+(F.sensationChange===o)+'">'+o+'</button>').join('')+'</div></div>';
  }
  h+='<div class="nav">'+(s>0?'<button class="btn ghost" id="prev">Back</button>':'')+(s<2?'<button class="btn" id="next">Next</button>':'<button class="btn" id="save">Save entry</button>')+'</div>';
  return h;
}
function rerenderForm(keepScroll){const y=window.scrollY;document.getElementById('app').innerHTML=formView();bindForm();window.scrollTo(0,keepScroll?y:0)}
function bindForm(){
  const app=document.getElementById('app');
  app.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('input',()=>{F[el.dataset.f]=el.value;saveDraft();if(el.dataset.f==='hot')app.querySelectorAll('[data-hot]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.hot===el.value)))}));
  const th=document.getElementById('f-thoughts');let ct=null;th&&th.addEventListener('input',()=>{clearTimeout(ct);ct=setTimeout(()=>{const lines=(F.thoughts||'').split('\n').map(x=>x.trim()).filter(Boolean);document.getElementById('chipbox').innerHTML=chipsHTML(lines);bindChips();const hi=document.getElementById('f-hot');if(hi)hi.placeholder=lines[0]||'The thought that worries me most'},500)});
  app.querySelectorAll('[data-r]').forEach(el=>el.addEventListener('input',()=>{F[el.dataset.r]=+el.value;document.getElementById('o-'+el.dataset.r).textContent=el.value+'%';saveDraft()}));
  bindChips();
  app.querySelectorAll('[data-emo]').forEach(el=>el.addEventListener('input',()=>{F.emotions[+el.dataset.emo].name=el.value;saveDraft()}));
  app.querySelectorAll('[data-emob]').forEach(el=>el.addEventListener('input',()=>{F.emotions[+el.dataset.emob].before=+el.value;el.nextElementSibling.textContent=el.value+'%';saveDraft()}));
  app.querySelectorAll('[data-emoa]').forEach(el=>el.addEventListener('input',()=>{F.emotions[+el.dataset.emoa].after=+el.value;el.nextElementSibling.textContent=el.value+'%';saveDraft()}));
  app.querySelectorAll('[data-rmemo]').forEach(b=>b.addEventListener('click',()=>{F.emotions.splice(+b.dataset.rmemo,1);if(!F.emotions.length)F.emotions.push({name:'',before:50,after:null});saveDraft();rerenderForm(true)}));
  const add=document.getElementById('addEmo');add&&add.addEventListener('click',()=>{F.emotions.push({name:'',before:50,after:null});saveDraft();rerenderForm(true);const ins=app.querySelectorAll('[data-emo]');ins[ins.length-1].focus()});
  app.querySelectorAll('[data-sens]').forEach(b=>b.addEventListener('click',()=>{F.sensationChange=b.dataset.sens;app.querySelectorAll('[data-sens]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));saveDraft()}));
  app.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{S.step=+b.dataset.step;rerenderForm()}));
  const nx=document.getElementById('next');nx&&nx.addEventListener('click',()=>{S.step++;rerenderForm()});
  const pv=document.getElementById('prev');pv&&pv.addEventListener('click',()=>{S.step--;rerenderForm()});
  document.getElementById('back').addEventListener('click',()=>{F&&F.id?go('entry-'+F.id):back('diary')});
  const sv=document.getElementById('save');sv&&sv.addEventListener('click',async()=>{
    if(!(F.thoughts||'').trim()&&!(F.hot||'').trim()){S.step=0;rerenderForm();toast('Add the thought you’re worried about first.');return}
    sv.disabled=true;
    const e=JSON.parse(JSON.stringify(F));
    if(!e.id){e.id=newId();e.created=Date.now()}
    if(!e.hot)e.hot=hotOf(e);
    e.emotions=e.emotions.filter(x=>x.name.trim());
    e.updated=Date.now();
    if(await saveEntry(e)){lsDel(LS_DRAFT);toast('Entry saved');F=null;go('entry-'+e.id)}else sv.disabled=false;
  });
}


/* ---------- Export and backup ---------- */
function stamp(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function shareFile(name,text,type){
  const blob=new Blob([text],{type});
  try{
    const file=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});return true;
    }
  }catch(e){if(e&&e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}
function diaryText(L){
  L.push('THOUGHT DIARY','');
  sorted().forEach(e=>{
    L.push('== '+fmtDate(e.created)+' ==');
    const add=(k,v)=>{if(v!=null&&String(v).trim())L.push(k+': '+v)};
    add('Trigger',e.trigger);add('Worries',e.thoughts);add('Most bothersome thought',e.hot);add('Belief before',e.beliefBefore+'%');
    (e.emotions||[]).forEach(x=>add('Emotion',x.name+' '+x.before+'%'+(x.after!=null?' then '+x.after+'%':'')));
    add('Physical sensations',e.sensations);add('Evidence for',e.evFor);add('Evidence against',e.evAgainst);
    add('Effect of expecting the worst',e.worstEffect);add('Coping if the worst happened',e.worstCope);add('Other explanations',e.alternatives);
    add('Most likely explanation',e.likely);add('Coping right now',e.copeNow);add('Realistic thought',e.realistic);
    if(e.beliefAfter!=null)add('Belief after',e.beliefAfter+'%');add('Physical sensations now',e.sensationChange);L.push('');
  });
}

/* ---------- Backup ---------- */
function fieldText(f,v){
  if(!isFilled(v))return null;
  if(f.type==='rate')return v+'%';
  if(f.type==='check')return v.join('; ');
  if(f.type==='scale4')return f.items.map((it,i)=>v[i]!=null?'  '+it+': '+OPT4[v[i]]:null).filter(Boolean).join('\n');
  if(f.type==='steps')return v.map(s=>'  '+(s.done?'[x] ':'[ ] ')+(s.t||'')+(s.d!=null?' (distress '+s.d+')':'')).join('\n');
  if(f.type==='log')return v.map(x=>'  '+fmtShort(x.ts)+': '+x.v+'%').join('\n');
  return String(v);
}
function recText(L,fm,r){fm.f.forEach(f=>{if(f.type==='head'){L.push('-- '+f.l+' --');return}const t=fieldText(f,r[f.k]);if(t!=null)L.push(f.l+'\n'+t)})}
function readableText(){
  const L=['Helping Health Anxiety: my work','Exported '+fmtDate(Date.now()),''];
  MODULES.forEach(m=>{
    const ids=m.tools.filter(id=>FORMS[id]&&FORMS[id].m===m.n);
    const any=ids.some(id=>FORMS[id].kind==='multi'?multiRecs(id).length:singleRec(id)&&Object.keys(singleRec(id)).length);
    if(!any)return;
    L.push('==== MODULE '+m.n+': '+m.t.toUpperCase()+' ====','');
    ids.forEach(id=>{const fm=FORMS[id];
      if(fm.kind==='multi')multiRecs(id).forEach(r=>{L.push('## '+fm.t+' ('+fmtDate(r.created)+')');recText(L,fm,r);L.push('')});
      else if(singleRec(id)){L.push('## '+fm.t);recText(L,fm,singleRec(id));L.push('')}
    });
  });
  if(S.entries.length)diaryText(L);
  const w=D.worry.items;if(w.length){L.push('WORRY LIST','');w.forEach(i=>L.push(fmtShort(i.ts)+': '+i.text+(i.status==='open'?' (waiting)':'')));L.push('')}
  return L.join('\n');
}
function hasAnything(){return S.entries.length||Object.keys(D.forms).length||D.worry.items.length}
function backupView(){
  const lb=lsGet(LS_BACKUP),n=hasAnything();
  let h='<header class="top"><h1>Backup</h1></header>';
  h+='<p class="lead">Everything you enter lives only on this phone. '+(lb?'Last backup: '+esc(fmtDate(lb))+'.':'No backup yet.')+'</p>';
  h+='<div class="card"><h3>Back up everything</h3><p>Your thought diary, worksheets, stepladders, worry list and progress in one file. Keep it in Files or iCloud Drive and restore it later, for example on a new phone.</p><button class="btn" id="bk" '+(n?'':'disabled')+'>Export backup</button></div>';
  h+='<div class="card"><h3>Share as readable text</h3><p>A plain text copy of all your work, handy for emailing to your psychologist or GP.</p><button class="btn ghost" id="tx" '+(n?'':'disabled')+'>Export as text</button></div>';
  h+='<div class="card"><h3>Restore from a backup</h3><p>Adds what’s in a backup file. Anything already on this phone is kept, and the newer version wins where both exist. Older thought diary backups work too.</p><button class="btn ghost" id="rs">Choose backup file</button><input type="file" id="rsf" accept=".json,application/json" hidden></div>';
  return h;
}
function mergeD(src){
  let c=0;src=src||{};
  Object.keys(src.forms||{}).forEach(id=>{
    const a=src.forms[id],b=D.forms[id];
    if(Array.isArray(a)){const L=Array.isArray(b)?b:(D.forms[id]=[]);a.forEach(r=>{if(!r||!r.id)return;const i=L.findIndex(x=>x.id===r.id);if(i<0){L.push(r);c++}else if((r.updated||0)>(L[i].updated||0)){L[i]=r;c++}})}
    else if(a&&typeof a==='object'){if(!b||(a.updated||0)>(b.updated||0)){D.forms[id]=a;c++}}
  });
  Object.keys(src.done||{}).forEach(k=>{if(src.done[k])D.done[k]=true});
  const w=src.worry||{};(w.items||[]).forEach(i=>{if(i&&i.id&&!D.worry.items.find(x=>x.id===i.id)){D.worry.items.push(i);c++}});
  if(w.period&&!D.worry.period.time)D.worry.period=w.period;
  if(!D.last&&src.last)D.last=src.last;
  return c;
}
function bindBackup(){
  document.getElementById('bk').addEventListener('click',async()=>{
    saveD();
    const data=JSON.stringify({app:'thought-diary',version:2,exported:Date.now(),entries:S.entries,hha:D},null,1);
    if(await shareFile('health-anxiety-backup-'+stamp()+'.json',data,'application/json')){lsSet(LS_BACKUP,Date.now());toast('Backup exported');render()}
  });
  document.getElementById('tx').addEventListener('click',()=>shareFile('health-anxiety-'+stamp()+'.txt',readableText(),'text/plain'));
  const f=document.getElementById('rsf');
  document.getElementById('rs').addEventListener('click',()=>f.click());
  f.addEventListener('change',async()=>{
    const file=f.files&&f.files[0];if(!file)return;
    try{
      const d=JSON.parse(await file.text());
      if(!d||d.app!=='thought-diary'||!Array.isArray(d.entries))throw 0;
      let c=0;
      d.entries.forEach(e=>{if(!e||!e.id)return;const i=S.entries.findIndex(x=>x.id===e.id);if(i<0){S.entries.push(e);c++}else if((e.updated||0)>(S.entries[i].updated||0)){S.entries[i]=e;c++}});
      lsSet(LS_ENTRIES,S.entries);
      if(d.hha){c+=mergeD(d.hha);saveD()}
      toast(c?c+' item'+(c===1?'':'s')+' restored':'Nothing new in that backup');render();
    }catch(e){toast('That file isn’t a backup from this app.')}
    f.value='';
  });
}

/* ---------- Router ---------- */
function tabFor(r){if(r==='backup')return 'backup';if(r===''||/^m[1-9]$/.test(r)||r==='about')return 'course';return 'tools'}
function render(){
  const r=route(),app=document.getElementById('app');let m;
  document.querySelectorAll('.tabbar a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===tabFor(r)?'page':'false'));
  const lb=lsGet(LS_BACKUP),stale=hasAnything()&&(!lb||Date.now()-lb>30*864e5);
  document.getElementById('bkdot').hidden=!stale;
  if(r==='')app.innerHTML=courseView();
  else if((m=r.match(/^m([1-9])$/))){app.innerHTML=moduleView(+m[1]);bindModule(+m[1])}
  else if(r==='tools')app.innerHTML=toolsView();
  else if(r==='about')app.innerHTML=aboutView();
  else if(r==='backup'){app.innerHTML=backupView();bindBackup()}
  else if(r==='worry'){app.innerHTML=worryView();bindWorry()}
  else if(r==='meditate'){app.innerHTML=meditateView();bindMeditate()}
  else if(r==='diary'){app.innerHTML=diaryHomeView();bindDiaryHome()}
  else if(r==='summary')app.innerHTML=summaryView();
  else if(r==='new'){openForm(null);app.innerHTML=formView();bindForm()}
  else if(r.indexOf('edit-')===0){const e=S.entries.find(x=>x.id===r.slice(5));if(!e)app.innerHTML=missing();else{openForm(e);app.innerHTML=formView();bindForm()}}
  else if(r.indexOf('entry-')===0){const e=S.entries.find(x=>x.id===r.slice(6));app.innerHTML=e?detailView(e):missing();bindDetail(e)}
  else if((m=r.match(/^f-([a-z0-9]+)(?:-(r[a-z0-9]+))?$/i))&&FORMS[m[1]]){R=null;app.innerHTML=worksheetView(m[1],m[2]);bindWorksheet(m[1],m[2])}
  else app.innerHTML=courseView();
}
function missing(){return hdr('Not found','diary')+'<p class="lead">This entry may have been deleted.</p>'}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-back]');if(b){e.preventDefault();back(b.dataset.back);return}
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go)}
});
render();
})();
</script>
